# codex add-on. setup.sh --addon codex installs this as <name>.container.d/21-codex.conf
# and fills in the paths. setup.sh also mounts codex.env into the gateway
# (<name>-gateway.container.d/50-addon-codex.conf), which allowlists OpenAI's hosts.
[Container]
# claude.md + entrypoint.d + libexec/install-codex (read-only)
Volume=@ADDON_DIR@/codex:/opt/agent-sandbox/addons/codex:ro,z
# Version and sandbox mode (no secrets). Shared label: the gateway mounts it too.
Volume=@CONFIG_DIR@/codex.env:/run/agent-sandbox/addons/codex.env:ro,z
# Codex home: config.toml, auth.json, sessions (setup.sh --codex-config: a host folder
# shared by all instances by default, so you can copy auth.json into it)
Volume=@CODEX_CONFIG@:/home/agent/.codex@CODEX_CONFIG_OPTS@
# The CLI, installed by the entrypoint (root-owned, read-only for the agent)
Volume=agent-sandbox-codex-cli:/opt/codex
Environment=CODEX_HOME=/home/agent/.codex
