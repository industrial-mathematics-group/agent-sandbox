# notify add-on. setup.sh --addon notify installs this as
# <name>.container.d/33-notify.conf and fills in the paths. setup.sh also mounts
# notify.env into the gateway (<name>-gateway.container.d/50-addon-notify.conf),
# which allowlists NOTIFY_URL's host and NOTIFY_PRIVATE_IP.
[Container]
# bin/notify + claude.md + entrypoint.d (read-only)
Volume=@ADDON_DIR@/notify:/opt/agent-sandbox/addons/notify:ro,z
# Service, URL and token, read by bin/notify (shared label: the gateway mounts it too)
Volume=@CONFIG_DIR@/notify.env:/run/agent-sandbox/addons/notify.env:ro,z
