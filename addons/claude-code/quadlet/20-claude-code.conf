# claude-code add-on. setup.sh installs this as <name>.container.d/20-claude-code.conf
# (always, unless only --addon codex is given) and fills in the paths. setup.sh also
# mounts claude-code.env into the gateway (<name>-gateway.container.d/50-addon-claude-code.conf),
# which allowlists Anthropic's hosts.
[Container]
# claude.md + entrypoint.d + libexec/install-claude-code (read-only)
Volume=@ADDON_DIR@/claude-code:/opt/agent-sandbox/addons/claude-code:ro,z
# Version (no secrets). Shared label: the gateway mounts the same file.
Volume=@CONFIG_DIR@/claude-code.env:/run/agent-sandbox/addons/claude-code.env:ro,z
# Claude login, settings and memory (setup.sh --claude-config: a named volume shared
# by all instances by default, or a host folder)
Volume=@CLAUDE_CONFIG@:/home/agent/.claude@CLAUDE_CONFIG_OPTS@
# The CLI, installed by the entrypoint (root-owned, read-only for the agent)
Volume=agent-sandbox-claude-cli:/opt/claude-code
# Updates come from the entrypoint, not from Claude Code itself
Environment=DISABLE_AUTOUPDATER=1
Environment=CLAUDE_CONFIG_DIR=/home/agent/.claude
Environment=CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
