# gpu-remote add-on. setup.sh --addon gpu-remote installs this as
# <name>.container.d/30-gpu-remote.conf and fills in the paths.
[Container]
# bin/gpu + claude.md (read-only)
Volume=@ADDON_DIR@/gpu-remote:/opt/agent-sandbox/addons/gpu-remote:ro,z
# id_ed25519 (limited to the gateway on the server) + known_hosts (pinned host key)
Volume=@CONFIG_DIR@/gpu-ssh:/run/gpu-ssh:ro,Z
EnvironmentFile=@CONFIG_DIR@/gpu-remote.env
