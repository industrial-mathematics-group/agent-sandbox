# Local NVIDIA GPU for the agent container, through CDI.
# setup.sh --gpu nvidia installs this as <name>.container.d/10-gpu-nvidia.conf.
#
# Host prerequisites: NVIDIA driver + nvidia-container-toolkit, then once:
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#   sudo setsebool -P container_use_devices on   # SELinux hosts
# CUDA itself comes from the language packages (CUDA.jl artifacts, PyTorch
# wheels), so no extra image layer is needed.
[Container]
AddDevice=nvidia.com/gpu=all
