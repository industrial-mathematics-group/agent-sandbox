# Local AMD GPU (ROCm) for the agent container.
# setup.sh --gpu amd installs this as <name>.container.d/10-gpu-amd.conf.
# Remove the file (+ daemon-reload, restart) to switch the GPU off again.
#
# Host prerequisites (once, as your admin user):
#   sudo setsebool -P container_use_devices on   # SELinux: let containers use passed-in devices
#   sandbox user in groups video + render         # done by setup.sh
[Container]
# Same flavor, plus the ROCm layer (setup.sh fills in the image)
Image=@IMAGE_ROCM@
AddDevice=/dev/kfd
AddDevice=/dev/dri
# Pass the host user's video/render groups in, and tell the entrypoint to keep them
GroupAdd=keep-groups
Environment=KEEP_GROUPS=1
Environment=ROCM_PATH=/opt/rocm
# Uncomment if ROCm doesn't recognise the card (should not be needed for gfx1201 on ROCm >= 6.4.1):
# Environment=HSA_OVERRIDE_GFX_VERSION=12.0.1
