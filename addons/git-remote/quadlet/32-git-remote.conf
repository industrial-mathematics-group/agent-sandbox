# git-remote add-on. setup.sh --addon git-remote installs this as
# <name>.container.d/32-git-remote.conf and fills in the paths. setup.sh also
# mounts git-remote.env into the gateway (<name>-gateway.container.d/50-addon-git-remote.conf),
# which allowlists GIT_REMOTE_HOST and GIT_REMOTE_PRIVATE_IP.
[Container]
# bin/git-remote + claude.md + entrypoint.d (read-only)
Volume=@ADDON_DIR@/git-remote:/opt/agent-sandbox/addons/git-remote:ro,z
# Host, service and token. A file, not EnvironmentFile: the token stays out of
# every process environment and is only read by the credential helper.
# Shared label (z): the gateway mounts the same file.
Volume=@CONFIG_DIR@/git-remote.env:/run/agent-sandbox/addons/git-remote.env:ro,z
