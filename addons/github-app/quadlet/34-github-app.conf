# github-app add-on, agent side. setup.sh --addon github-app installs this as
# <name>.container.d/34-github-app.conf and fills in the paths. Only the client is
# mounted here: github-app.env and the App's private key go into the gateway
# (<name>-gateway.container.d/50-addon-github-app.conf and 51-github-app-key.conf),
# whose token broker hands out short-lived installation tokens on 127.0.0.1:3129.
[Container]
# bin/github-app + bin/gh + claude.md + entrypoint.d (read-only)
Volume=@ADDON_DIR@/github-app:/opt/agent-sandbox/addons/github-app:ro,z
