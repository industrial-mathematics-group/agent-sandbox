# github-app add-on, gateway side. setup.sh --addon github-app installs this as
# @NAME@-gateway.container.d/51-github-app-key.conf. The App's private key, mounted
# into the gateway only (private label Z: the agent container never gets it). The
# gateway's token broker copies it to its own user at start.
[Container]
Volume=@CONFIG_DIR@/github-app.pem:/etc/agent-sandbox/secrets/github-app.pem:ro,Z
