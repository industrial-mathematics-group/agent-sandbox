# slurm add-on. setup.sh --addon slurm installs this as
# <name>.container.d/31-slurm.conf and fills in the paths.
[Container]
# bin/slurm + claude.md (read-only)
Volume=@ADDON_DIR@/slurm:/opt/agent-sandbox/addons/slurm:ro,z
# id_ed25519 (limited to the gateway on the cluster) + known_hosts (pinned host key)
Volume=@CONFIG_DIR@/slurm-ssh:/run/slurm-ssh:ro,Z
EnvironmentFile=@CONFIG_DIR@/slurm.env
