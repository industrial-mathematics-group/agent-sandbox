# Documentation site, built with Zensical (https://zensical.org):
#   pip install zensical && zensical serve      # preview on http://localhost:8000
#   zensical build --clean                      # static site in site/
[project]
site_name = "agent-sandbox"
site_description = "Sandboxed containers for running coding agents with full permissions, without handing them your machine or your network."
site_url = "https://industrial-mathematics-group.github.io/agent-sandbox/"
repo_url = "https://github.com/industrial-mathematics-group/agent-sandbox"
repo_name = "industrial-mathematics-group/agent-sandbox"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed. Not an Anthropic or OpenAI product."

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/quadlet.md",
    "getting-started/compose.md",
  ] },
  { "Concepts" = [
    "concepts/index.md",
    "concepts/images.md",
    "concepts/gateway.md",
    "concepts/addons.md",
    "concepts/isolation.md",
  ] },
  { "Deployment" = [
    "deployment/index.md",
    "deployment/quadlet.md",
    "deployment/compose.md",
    "deployment/tailscale.md",
    "deployment/updates.md",
  ] },
  { "Add-ons" = [
    "addons/index.md",
    "addons/claude-code.md",
    "addons/codex.md",
    "addons/github-app.md",
    "addons/git-remote.md",
    "addons/notify.md",
    "addons/gpu-local.md",
    "addons/gpu-remote.md",
    "addons/slurm.md",
  ] },
  { "Guides" = [
    "guides/network-allowlist.md",
    "guides/graphics-browsers.md",
    "guides/troubleshooting.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/setup-sh.md",
    "reference/build-sh.md",
    "reference/gateway-env.md",
    "reference/sandbox-env.md",
    "reference/compose-env.md",
    "reference/allowlists.md",
    "reference/paths-volumes.md",
  ] },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/box"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
