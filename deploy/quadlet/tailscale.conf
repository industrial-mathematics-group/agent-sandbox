# Tailscale variant of the gateway: all egress only through your exit node.
# setup.sh --net tailscale installs this as @NAME@-gateway.container.d/10-tailscale.conf.
# TS_AUTHKEY, TS_EXIT_NODE, TS_HOSTNAME go into gateway.env.
[Container]
Image=@GATEWAY_TS_IMAGE@
Environment=GATEWAY_VPN=tailscale
Volume=@NAME@-tailscale-state:/var/lib/tailscale
AddDevice=/dev/net/tun
# SELinux blocks /dev/net/tun for confined containers; gateway only
SecurityLabelDisable=true
Sysctl=net.ipv4.conf.all.src_valid_mark=1
Sysctl=net.ipv4.conf.all.rp_filter=2
Sysctl=net.ipv4.conf.default.rp_filter=2
