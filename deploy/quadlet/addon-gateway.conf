# @ADDON@ add-on, gateway side. setup.sh --addon @ADDON@ installs this as
# @NAME@-gateway.container.d/50-addon-@ADDON@.conf. The gateway reads the add-on's
# env file at start: every *_HOST and *_URL host is allowlisted and every
# *_PRIVATE_IP address is let through the private-range block. Other keys (tokens)
# are ignored. Remove this file to manage the add-on's hosts yourself.
[Container]
Volume=@CONFIG_DIR@/@ADDON@.env:/etc/agent-sandbox/addons/@ADDON@.env:ro,z
